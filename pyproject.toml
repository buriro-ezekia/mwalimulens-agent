[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mwalimulens-agent"
version = "0.1.0"
description = "Evidence-grounded longitudinal learning intelligence for teachers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Buriro Chimodoi Ezekia"}
]
dependencies = [
  "mcp[cli]>=2,<3",
  "pydantic-ai-slim[mcp,openai]>=2.51,<2.52",
  "fastmcp-slim[client]>=4,<5",
]

[project.scripts]
mwalimulens-challenge = "mwalimulens.challenge_run:main"
mwalimulens-demo = "mwalimulens.demo_run:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
